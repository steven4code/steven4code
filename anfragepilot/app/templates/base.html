<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AnfragePilot Handwerk{% endblock %}</title>
<style>
  :root {
    --bg: #f5f4f0; --card: #ffffff; --ink: #1f2a24; --muted: #68746d;
    --line: #e2e0d8; --accent: #1d6b4f; --accent-ink: #ffffff;
    --warn: #b4552d; --prio-a: #b4372d; --prio-b: #8a6d1f; --prio-c: #68746d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--accent); color: var(--accent-ink); padding: 0.7rem 1.4rem; display: flex; align-items: baseline; gap: 1.6rem; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.02em; }
  header .sub { opacity: 0.85; font-size: 0.85rem; }
  nav a { color: var(--accent-ink); text-decoration: none; margin-right: 1rem; font-size: 0.95rem; opacity: 0.92; }
  nav a:hover { text-decoration: underline; }
  main { max-width: 1180px; margin: 1.4rem auto; padding: 0 1.2rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1.1rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.7rem; }
  h3 { font-size: 0.95rem; margin: 1rem 0 0.4rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:hover td { background: #f8f7f3; }
  a { color: var(--accent); }
  .badge { display: inline-block; padding: 0.1rem 0.55rem; border-radius: 99px; font-size: 0.78rem; font-weight: 600; border: 1px solid var(--line); background: #f1efe9; white-space: nowrap; }
  .badge.prio-A { background: #f7e3e1; color: var(--prio-a); border-color: #e3b7b2; }
  .badge.prio-B { background: #f6efd9; color: var(--prio-b); border-color: #e0d3a6; }
  .badge.prio-C { background: #ecefed; color: var(--prio-c); }
  .badge.frei-offen { background: #f6efd9; color: var(--prio-b); }
  .badge.frei-freigegeben { background: #e0efe7; color: var(--accent); }
  .badge.frei-abgelehnt { background: #f7e3e1; color: var(--prio-a); }
  .badge.frei-nicht_noetig { background: #ecefed; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.9rem; margin-bottom: 1.1rem; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem 1rem; }
  .kpi .num { font-size: 1.7rem; font-weight: 700; }
  .kpi .lbl { color: var(--muted); font-size: 0.82rem; }
  form.inline { display: inline; }
  input[type=text], input[type=email], select, textarea { width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--line); border-radius: 7px; font: inherit; background: #fff; }
  textarea { min-height: 130px; resize: vertical; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0.6rem 0 0.2rem; }
  button, .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px; padding: 0.5rem 1rem; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary, .btn.secondary { background: #eceae2; color: var(--ink); }
  button.danger { background: var(--warn); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  pre { white-space: pre-wrap; background: #f8f7f3; border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem; font-size: 0.85rem; font-family: inherit; }
  .grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.1rem; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  ul.plain { margin: 0.2rem 0; padding-left: 1.2rem; }
  .hinweis { background: #f6efd9; border: 1px solid #e0d3a6; border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 0.87rem; margin-bottom: 1rem; }
  .filterbar { display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: end; margin-bottom: 0.9rem; }
  .filterbar > div { min-width: 170px; }
</style>
</head>
<body>
<header>
  <h1>⚙ AnfragePilot Handwerk</h1>
  <span class="sub">{{ betrieb.name }} · {{ betrieb.region }}</span>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/neu">Neue Anfrage erfassen</a>
    <a href="/report">Monatsreport</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
